<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Budget architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f5f5;
    --paper-2: #ececec;
    --ink: #2d3142;
    --muted: #6b7080;
    --soft: #9a9eab;
    --rule: rgba(45, 49, 66, 0.16);
    --accent: #bf4520;
    --accent-tint: #f7e4dc;
    --link: #2b5f8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; }
  figure { margin: 0 auto; padding: 40px 16px 32px; max-width: 1112px; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px 16px; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 40px; margin: 0 0 20px 16px; }
  .scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 1048px; height: auto; }
  .name { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 15px; fill: var(--ink); }
  .sub { font-family: 'Geist Mono', monospace; font-size: 11px; fill: var(--muted); }
  .tag { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.08em; }
  .lbl { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.06em; }
  .zone { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.08em; fill: var(--muted); }
  .note { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; fill: var(--muted); }
</style>
</head>
<body>
<figure>
  <p class="eyebrow">AUTO BUDGET · ARCHITECTURE</p>
  <h1>From a list of expenses to an AI budget analysis</h1>
  <div class="scroll">
  <svg viewBox="0 96 1048 464" role="img" aria-labelledby="architecture-title architecture-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="architecture-title">Auto Budget architecture</title>
    <desc id="architecture-desc">The browser loads the React app from nginx and calls the Spring Boot REST API directly; the API stores users and budgets in MySQL, sends each budget to Gemini on Vertex AI for analysis, and can email the result through Gmail SMTP. The React app, API and MySQL run together under Docker Compose.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7080"/></marker>
      <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
      <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5f8a"/></marker>
    </defs>

    <rect y="96" width="1048" height="464" fill="#f5f5f5"/>

    <!-- Docker Compose boundary -->
    <rect x="224" y="104" width="528" height="364" rx="8" fill="none" stroke="#2d3142" stroke-opacity="0.28" stroke-dasharray="4,4"/>
    <text class="zone" x="240" y="452">DOCKER COMPOSE · mynetwork</text>
    <text class="zone" x="816" y="164">GOOGLE CLOUD</text>

    <!-- Connectors (drawn before nodes) -->
    <!-- Browser -> React -->
    <line x1="176" y1="236" x2="262" y2="236" stroke="#6b7080" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="190" y="212" width="60" height="14" fill="#f5f5f5"/>
    <text class="lbl" x="220" y="223" text-anchor="middle" fill="#6b7080">LOADS UI</text>

    <!-- Browser -> Spring (REST) -->
    <path d="M108,200 V160 Q108,152 116,152 H608 Q616,152 616,160 V198" fill="none" stroke="#2b5f8a" stroke-width="1.5" marker-end="url(#arrow-link)"/>
    <rect x="318" y="128" width="88" height="14" fill="#f5f5f5"/>
    <text class="lbl" x="362" y="139" text-anchor="middle" fill="#2b5f8a">REST · JSON</text>

    <!-- Spring -> MySQL -->
    <line x1="616" y1="272" x2="616" y2="358" stroke="#6b7080" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="624" y="308" width="72" height="14" fill="#f5f5f5"/>
    <text class="lbl" x="628" y="319" fill="#6b7080">JPA · JDBC</text>

    <!-- Spring -> Gemini (focal) -->
    <line x1="712" y1="224" x2="814" y2="224" stroke="#bf4520" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <rect x="734" y="200" width="60" height="14" fill="#f5f5f5"/>
    <text class="lbl" x="764" y="211" text-anchor="middle" fill="#bf4520">PROMPT</text>

    <!-- Spring -> Gmail (optional) -->
    <path d="M712,248 H756 Q764,248 764,256 V324 Q764,332 772,332 H814" fill="none" stroke="#6b7080" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="770" y="308" width="40" height="14" fill="#f5f5f5"/>
    <text class="lbl" x="790" y="319" text-anchor="middle" fill="#6b7080">EMAIL</text>

    <!-- Nodes -->
    <!-- Browser (user) -->
    <rect x="40" y="200" width="136" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="40" y="200" width="136" height="72" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
    <rect x="52" y="210" width="36" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
    <text class="tag" x="70" y="220" text-anchor="middle" fill="#2d3142">USER</text>
    <text class="name" x="52" y="246">Browser</text>
    <text class="sub" x="52" y="262">guest or login</text>

    <!-- React -->
    <rect x="264" y="200" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="276" y="210" width="64" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
    <text class="tag" x="308" y="220" text-anchor="middle" fill="#2d3142">FRONTEND</text>
    <text class="name" x="276" y="246">React app</text>
    <text class="sub" x="276" y="262">nginx · :3000</text>

    <!-- Spring Boot -->
    <rect x="520" y="200" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <rect x="532" y="210" width="28" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
    <text class="tag" x="546" y="220" text-anchor="middle" fill="#2d3142">API</text>
    <text class="name" x="532" y="246">Spring Boot</text>
    <text class="sub" x="532" y="262">/user · /budget · :8080</text>

    <!-- MySQL -->
    <rect x="520" y="360" width="192" height="72" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
    <rect x="532" y="370" width="44" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
    <text class="tag" x="554" y="380" text-anchor="middle" fill="#2d3142">STORE</text>
    <text class="name" x="532" y="406">MySQL 8</text>
    <text class="sub" x="532" y="422">users · budgets · :3306</text>

    <!-- Gemini (focal) -->
    <rect x="816" y="188" width="192" height="72" rx="6" fill="#f7e4dc" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="828" y="198" width="28" height="14" rx="2" fill="#bf4520"/>
    <text class="tag" x="842" y="208" text-anchor="middle" fill="#ffffff">LLM</text>
    <text class="name" x="828" y="234">Gemini 1.5 Flash</text>
    <text class="sub" x="828" y="250">Vertex AI · us-west1</text>

    <!-- Gmail (optional) -->
    <rect x="816" y="296" width="192" height="72" rx="6" fill="#f5f5f5" stroke="#6b7080" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="828" y="306" width="60" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
    <text class="tag" x="858" y="316" text-anchor="middle" fill="#2d3142">OPTIONAL</text>
    <text class="name" x="828" y="342">Gmail SMTP</text>
    <text class="sub" x="828" y="358">emailed results</text>

    <!-- Callout -->
    <text class="note" x="816" y="404">The API sends each budget</text>
    <text class="note" x="816" y="424">as a prompt; Gemini replies</text>
    <text class="note" x="816" y="444">with a Markdown analysis.</text>

    <!-- Legend strip -->
    <line x1="40" y1="500" x2="1008" y2="500" stroke="#2d3142" stroke-opacity="0.16"/>
    <line x1="40" y1="528" x2="72" y2="528" stroke="#bf4520" stroke-width="2"/>
    <text class="lbl" x="80" y="532" fill="#2d3142">AI ANALYSIS CALL</text>
    <line x1="232" y1="528" x2="264" y2="528" stroke="#2b5f8a" stroke-width="1.5"/>
    <text class="lbl" x="272" y="532" fill="#2d3142">HTTP FROM THE BROWSER</text>
    <line x1="464" y1="528" x2="496" y2="528" stroke="#6b7080" stroke-width="1.5"/>
    <text class="lbl" x="504" y="532" fill="#2d3142">INTERNAL CALL</text>
    <line x1="640" y1="528" x2="672" y2="528" stroke="#6b7080" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text class="lbl" x="680" y="532" fill="#2d3142">OPTIONAL (NEEDS MAIL_USERNAME)</text>
  </svg>
  </div>
</figure>
</body>
</html>
